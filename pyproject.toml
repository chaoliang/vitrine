[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitrine"
version = "0.1.0"
description = "配置驱动的服饰商品视频产线：一个配置出一条竖屏带货片"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
beatgrid = ["numpy>=1.24"]
local = ["torch", "diffusers", "transformers", "accelerate"]

[project.scripts]
vitrine = "vitrine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vitrine"]
